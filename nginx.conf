server {
    listen 80;
    server_name jizero.xyz www.jizero.xyz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name jizero.xyz www.jizero.xyz;
    ssl_certificate /etc/letsencrypt/live/jizero.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jizero.xyz/privkey.pem;
    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded-for;
    }
}
